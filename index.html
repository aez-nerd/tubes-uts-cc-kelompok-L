<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papan Catatan Tugas Kelompok — Team Task & Note List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 32px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.92rem;
      opacity: 0.9;
    }

    .card {
      background: #ffffff;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }

    input, select, textarea {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
    }

    button.btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    button.btn-primary:hover {
      background-color: #1d4ed8;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.88rem;
      color: #64748b;
    }

    .badge-count {
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
    }

    .task-info h3 {
      font-size: 1rem;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .task-meta {
      font-size: 0.84rem;
      color: #475569;
      margin-bottom: 6px;
    }

    .task-note {
      font-size: 0.88rem;
      color: #334155;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid #3b82f6;
    }

    .priority-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 6px;
    }

    .priority-Tinggi { background: #fee2e2; color: #991b1b; }
    .priority-Normal { background: #e0f2fe; color: #075985; }
    .priority-Rendah { background: #dcfce7; color: #166534; }

    .btn-delete {
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    .empty-state {
      text-align: center;
      padding: 28px;
      color: #64748b;
      font-size: 0.95rem;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      display: none;
    }

    .alert.success { background: #dcfce7; color: #166534; display: block; }
    .alert.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Papan Catatan Tugas — Kelompok L</h1>
      <p>Studi Kasus #6: Team Task & Note List — Cloud Computing UTS</p>
    </header>

    <!-- Form Tambah Tugas (POST /tasks) -->
    <div class="card">
      <h2>Tambah Tugas Baru</h2>
      <div id="alertBox" class="alert"></div>
      <form id="taskForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="title">Nama Tugas *</label>
            <input type="text" id="title" placeholder="Contoh: Buat file Dockerfile" required />
          </div>
          <div class="form-group">
            <label for="assignee">Penanggung Jawab (Anggota) *</label>
            <input type="text" id="assignee" placeholder="Contoh: Budi" required />
          </div>
          <div class="form-group">
            <label for="priority">Prioritas</label>
            <select id="priority">
              <option value="Tinggi">🔴 Tinggi</option>
              <option value="Normal" selected>🔵 Normal</option>
              <option value="Rendah">🟢 Rendah</option>
            </select>
          </div>
          <div class="form-group">
            <label for="note">Catatan Tambahan</label>
            <input type="text" id="note" placeholder="Contoh: Deadline hari Jumat" />
          </div>
        </div>
        <button type="submit" class="btn-primary">+ Tambah ke Daftar Tugas</button>
      </form>
    </div>

    <!-- Daftar Tugas (GET /tasks & DELETE /tasks?index=X) -->
    <div class="card">
      <div class="status-bar">
        <h2>Daftar Tugas Tim</h2>
        <span id="taskCount" class="badge-count">0 Tugas</span>
      </div>
      <div id="taskList" class="task-list">
        <div class="empty-state">Memuat data tugas dari Backend API...</div>
      </div>
    </div>
  </div>

  <script>
    // Otomatis mencoba lewat Nginx proxy (/tasks via Docker DNS backend) atau langsung ke port 5000
    let API_BASE = "/tasks";

    async function requestTasks(pathAndQuery, options = {}) {
      try {
        const res = await fetch(API_BASE + pathAndQuery, options);
        if (res.headers.get("content-type")?.includes("application/json")) {
          return res;
        }
      } catch (_) {
        // Fallback ke port 5000 jika diakses langsung tanpa reverse proxy
      }
      API_BASE = `http://${window.location.hostname || "localhost"}:5000/tasks`;
      return fetch(API_BASE + pathAndQuery, options);
    }

    function showAlert(message, type = "success") {
      const box = document.getElementById("alertBox");
      box.textContent = message;
      box.className = `alert ${type}`;
      setTimeout(() => {
        box.className = "alert";
      }, 3000);
    }

    // 1. GET /tasks — Mengambil daftar tugas dari Backend
    async function fetchTasks() {
      const listEl = document.getElementById("taskList");
      const countEl = document.getElementById("taskCount");

      try {
        const response = await requestTasks("");
        const result = await response.json();
        const tasks = result.data || [];

        countEl.textContent = `${tasks.length} Tugas`;

        if (tasks.length === 0) {
          listEl.innerHTML = `<div class="empty-state">Belum ada tugas tercatat. Yuk tambahkan tugas pertama kelompokmu!</div>`;
          return;
        }

        listEl.innerHTML = tasks
          .map(
            (task, index) => `
          <div class="task-item">
            <div class="task-info">
              <h3>
                #${index + 1} ${escapeHtml(task.title)}
                <span class="priority-badge priority-${escapeHtml(task.priority || "Normal")}">
                  ${escapeHtml(task.priority || "Normal")}
                </span>
              </h3>
              <div class="task-meta">👤 Penanggung Jawab: <strong>${escapeHtml(task.assignee)}</strong></div>
              ${task.note ? `<div class="task-note">📝 ${escapeHtml(task.note)}</div>` : ""}
            </div>
            <button class="btn-delete" onclick="deleteTask(${index})">✓ Selesai / Hapus</button>
          </div>
        `
          )
          .join("");
      } catch (error) {
        listEl.innerHTML = `<div class="empty-state">⚠️ Gagal terhubung ke Backend API. Pastikan kontainer backend sedang berjalan.</div>`;
        console.error("Error fetching tasks:", error);
      }
    }

    // 2. POST /tasks — Mengirim tugas baru ke Backend
    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById("title").value.trim(),
        assignee: document.getElementById("assignee").value.trim(),
        priority: document.getElementById("priority").value,
        note: document.getElementById("note").value.trim(),
      };

      try {
        const response = await requestTasks("", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const result = await response.json();

        if (response.ok) {
          document.getElementById("taskForm").reset();
          showAlert("Tugas berhasil ditambahkan!", "success");
          fetchTasks(); // Real-time refresh tanpa reload halaman
        } else {
          showAlert(result.message || "Gagal menambah tugas", "error");
        }
      } catch (error) {
        showAlert("Gagal menghubungi server Backend", "error");
      }
    });

    // 3. DELETE /tasks?index=X — Menghapus tugas berdasarkan index secara real-time
    async function deleteTask(index) {
      try {
        const response = await requestTasks(`?index=${index}`, {
          method: "DELETE",
        });
        const result = await response.json();

        if (response.ok) {
          showAlert(result.message || "Tugas selesai & dihapus!", "success");
          fetchTasks(); // Real-time update tanpa reload halaman
        } else {
          showAlert(result.message || "Gagal menghapus tugas", "error");
        }
      } catch (error) {
        showAlert("Gagal menghubungi server Backend", "error");
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Muat daftar tugas saat halaman pertama kali dibuka
    fetchTasks();
  </script>
</body>
</html>
